# Render Blueprint: a free Docker web service (it sleeps when idle).
services:
  - type: web
    name: java-code-reviewer
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/info
    autoDeploy: true
    envVars:
      # The provider key (an OpenRouter key by default). Render asks for it at creation.
      - key: REVIEWER_API_KEY
        sync: false
